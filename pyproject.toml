[tool.poetry]
name = "pharmpilot"
version = "0.1.0"
description = "PharmPilot AI — Intelligent Pharmacy Operations Platform"
authors = ["PharmPilot Team"]
python = "^3.11"

[tool.poetry.dependencies]
python = "^3.11"

# Web framework
fastapi = "^0.111.0"
uvicorn = { extras = ["standard"], version = "^0.30.0" }
pydantic = "^2.7.0"
pydantic-settings = "^2.3.0"

# Database
sqlalchemy = { extras = ["asyncio"], version = "^2.0.30" }
alembic = "^1.13.0"
asyncpg = "^0.29.0"
redis = { extras = ["hiredis"], version = "^5.0.0" }

# ML / AI
numpy = "^1.26.0"
pandas = "^2.2.0"
scikit-learn = "^1.5.0"
xgboost = "^2.0.3"
torch = "^2.3.0"
transformers = "^4.41.0"
faiss-cpu = "^1.8.0"
prophet = "^1.1.5"

# Computer Vision / Biometrics
opencv-python = "^4.10.0"
insightface = "^0.7.3"
onnxruntime = "^1.18.0"

# Audio Processing
pyaudio = "^0.2.14"
librosa = "^0.10.2"
soundfile = "^0.12.1"
webrtcvad = "^2.0.10"
noisereduce = "^3.0.0"
pyannote-audio = "^3.1.1"
openai-whisper = "^20231117"

# NLP
spacy = "^3.7.4"
sentence-transformers = "^3.0.0"

# Healthcare Standards
hl7 = "^0.4.5"
fhir-resources = "^7.1.0"

# Messaging / Streaming
aiokafka = "^0.11.0"
celery = { extras = ["redis"], version = "^5.4.0" }

# HTTP Client
httpx = "^0.27.0"
aiohttp = "^3.9.0"

# Security
cryptography = "^42.0.0"
python-jose = { extras = ["cryptography"], version = "^3.3.0" }
passlib = { extras = ["bcrypt"], version = "^1.7.4" }
pyotp = "^2.9.0"

# Monitoring
opentelemetry-api = "^1.25.0"
opentelemetry-sdk = "^1.25.0"
opentelemetry-instrumentation-fastapi = "^0.46b0"
prometheus-client = "^0.20.0"

# Utilities
python-multipart = "^0.0.9"
python-dotenv = "^1.0.1"
structlog = "^24.2.0"
tenacity = "^8.3.0"
arrow = "^1.3.0"

[tool.poetry.dev-dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.23.0"
pytest-cov = "^5.0.0"
httpx = "^0.27.0"
faker = "^25.2.0"
ruff = "^0.4.0"
mypy = "^1.10.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
