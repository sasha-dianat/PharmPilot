version: "3.9"

services:
  # ── Core Database ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pharmpilot
      POSTGRES_USER: pharmpilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pharmpilot_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pharmpilot"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Cache / Queue ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_dev}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # ── Message Streaming ──────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data

  # ── Analytics Database ─────────────────────────────────────────
  clickhouse:
    image: clickhouse/clickhouse-server:24.4
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  # ── Vector Database (Clinical Knowledge Base) ──────────────────
  qdrant:
    image: qdrant/qdrant:v1.9.0
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334

  # ── Core API ───────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+asyncpg://pharmpilot:${POSTGRES_PASSWORD:-pharmpilot_dev}@postgres:5432/pharmpilot
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_dev}@redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      ENVIRONMENT: development
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command: uvicorn services.platform.main:app --host 0.0.0.0 --port 8000 --reload

  # ── Audio Processing Service ───────────────────────────────────
  audio_processor:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.audio
    depends_on:
      - kafka
      - redis
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_dev}@redis:6379/0
      WHISPER_MODEL: medium.en
      NOISE_CANCELLATION_ENABLED: "true"
    volumes:
      - audio_models:/app/models
      - .:/app

  # ── Biometric Service ──────────────────────────────────────────
  biometric_service:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.biometric
    depends_on:
      - postgres
      - redis
      - kafka
    environment:
      DATABASE_URL: postgresql+asyncpg://pharmpilot:${POSTGRES_PASSWORD:-pharmpilot_dev}@postgres:5432/pharmpilot
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      FAISS_INDEX_PATH: /app/data/biometric_index
      ARCFACE_MODEL_PATH: /app/models/arcface_r100.onnx
    volumes:
      - biometric_models:/app/models
      - biometric_index:/app/data/biometric_index
      - .:/app

  # ── AI Clinical Brain ──────────────────────────────────────────
  clinical_brain:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.clinical_brain
    depends_on:
      - postgres
      - redis
    environment:
      DATABASE_URL: postgresql+asyncpg://pharmpilot:${POSTGRES_PASSWORD:-pharmpilot_dev}@postgres:5432/pharmpilot
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_dev}@redis:6379/0
      DRUG_DB_VENDOR: fdb
      FDB_API_KEY: ${FDB_API_KEY:-}
    volumes:
      - clinical_models:/app/models
      - .:/app

  # ── ML Inventory Engine ────────────────────────────────────────
  inventory_ml:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.ml
    depends_on:
      - postgres
      - redis
      - clickhouse
    environment:
      DATABASE_URL: postgresql+asyncpg://pharmpilot:${POSTGRES_PASSWORD:-pharmpilot_dev}@postgres:5432/pharmpilot
      CLICKHOUSE_URL: http://clickhouse:8123
    volumes:
      - ml_models:/app/models
      - .:/app

  # ── Celery Workers ─────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    depends_on:
      - redis
      - postgres
    environment:
      DATABASE_URL: postgresql+asyncpg://pharmpilot:${POSTGRES_PASSWORD:-pharmpilot_dev}@postgres:5432/pharmpilot
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_dev}@redis:6379/0
    command: celery -A services.platform.celery_app worker --loglevel=info -Q default,clinical,biometric,audio

  # ── Monitoring ─────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.52.0
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:10.4.0
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  zookeeper_data:
  clickhouse_data:
  prometheus_data:
  grafana_data:
  audio_models:
  biometric_models:
  biometric_index:
  clinical_models:
  ml_models:
  qdrant_data:
